# Values the generator needs from the build, filtered by Maven (see this module's pom).
#
# `protocol.version` is the coordinate a generated project depends on. It is filtered from the
# project's own version rather than written into the template, so bumping the release moves both:
# a template one release behind produces a project nobody can resolve, and that failure would land
# in the generated project's build, not in this repository's.
#
# Note the `@` delimiters: Spring Boot's parent sets resource.delimiter to `@` and turns Maven's
# default `${...}` off, because `${...}` is Spring's own placeholder syntax in application.properties.
# Written as ${project.version} this file would pass through unfiltered — see the guard in
# JavaGenerator.protocolVersion(), which fails loudly on exactly that.
protocol.version=@project.version@
