#
# JV-24 — the web side of the flagship demo. Its whole job is to put the front end and the API on **one
# origin**, so a browser demo needs no CORS and no second base URL: the front end is built with the
# relative base `/api/v1` and everything under `/api/` is proxied to the application container.
#
# JV-24 —— 旗舰演示的 web 侧。它的全部职责是让前端与接口处在**同一个源**上，于是浏览器演示既不需要
# CORS、也不需要第二个基址：前端以相对基址 `/api/v1` 构建，而 `/api/` 下的一切都反代到应用容器。
server {
    listen 80;
    root /usr/share/nginx/html;

    # The console builds as an **entry under `admin/`** — that is the deployed convention, and it is what
    # `Web-Admin-Vue` emits — and it is a single-page app: a path it does not know is one of its own
    # routes, not a 404.
    #
    # 控制台以 **`admin/` 下的一个入口**构建——这是部署约定，也是 `Web-Admin-Vue` 实际的产物形状——而它
    # 是单页应用：它不认识的路径是**它自己的路由**，不是 404。
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # The demo's own URL is short and is not the console's; send it where the console is.
    #
    # 演示自己的地址是短的、也不是控制台本身的；把它送到控制台那里。
    location = / {
        return 302 /admin/;
    }

    # Same origin for the API — which is the point of this file.
    #
    # 接口同源——这正是本文件存在的理由。
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
    }
}
