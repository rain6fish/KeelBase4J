# Publish to Maven Central on a version tag (`git tag v0.1.0 && git push gitee v0.1.0 && git push origin v0.1.0`).
#
# What goes up: the parent pom, `keelbase4j-protocol`, `keelbase4j-core` and the Spring AI adapter —
# the four a *host* resolves when it embeds this runtime. Until 0.1.2 only the first two did, so a
# host could only get the core and the adapter by building this repository locally first; that is what
# changed, and it is a boundary change rather than a packaging detail: those two are now a public API
# surface. `-am` stays, so a dependency added later cannot quietly fall outside the set;
# `keelbase4j-runtime` is excluded by name because `-am` reaches it through the adapter's *test*
# dependency and it is an application, not something anyone resolves. The generator, the MCP adapter
# and the demo are not in that closure at all.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD — Maven Central Portal user token
#     (central.sonatype.com → Account → User Token)
#   GPG_SECRET_KEY  — ASCII-armored export of the signing key (gpg --armor --export-secret-keys <id>)
#   GPG_KEY_ID      — the signing key's id
#   GPG_PASSPHRASE  — that key's passphrase
#
# Signing lives here rather than on a developer machine on purpose: a release should not require a
# private key in anybody's ~/.gnupg to be reproducible.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The runner image's Maven moved from 3.9.16 to 3.10.0, and on 3.10.0
      # `central-publishing-maven-plugin:0.9.0` stops deleting `maven-metadata-central-staging.xml`
      # from each artifact folder before bundling. The leftovers leave every `<group>/<artifact>`
      # directory holding content with no `.pom` beside it, and Central rejects the deployment with
      # "Bundle has content that does NOT have a .pom file". Nothing in this repository changed
      # between the release that published and the two that did not: the bundle carries the same four
      # artifacts, 0.1.3's log deletes those files and 0.1.4's and 0.1.5's never mention them. Pinned
      # back to the version that deletes them. Downloaded here rather than through a third-party
      # action, because this job holds the signing key and the Central token; the hash is Apache's
      # own, from `apache-maven-3.9.16-bin.tar.gz.sha512`.
      #
      # runner 镜像的 Maven 从 3.9.16 升到了 3.10.0，而在这个版本上
      # `central-publishing-maven-plugin:0.9.0` 不再于打包前删掉每个 artifact 目录里的
      # `maven-metadata-central-staging.xml`。残留下来，每个 `<group>/<artifact>` 目录里就放着有内容
      # 却没有 `.pom` 的东西，Central 于是以「Bundle has content that does NOT have a .pom file」拒绝
      # 这次部署。本仓在「发成功的那版」与「没发成的两版」之间没有任何相关改动：bundle 里都是那四个
      # artifact，而 0.1.3 的日志删掉了那些文件、0.1.4 与 0.1.5 的日志从未提到它们。现钉回会删它们的
      # 那个版本。这里自行下载而不用第三方 action —— 这一步握着签名私钥与 Central 凭据；哈希取自
      # Apache 自己对 `apache-maven-3.9.16-bin.tar.gz.sha512` 的记载。
      - name: Pin Maven back to the version that cleans the bundle
        run: |
          set -euo pipefail
          url=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          curl -fsSLo /tmp/apache-maven.tar.gz "$url"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/apache-maven.tar.gz" | sha512sum -c -
          sudo tar -xzf /tmp/apache-maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.16/bin/mvn -v

      # The protocol's tests read the vendored vectors from the repository root; they are in the
      # checkout already, so the tag is verified by the same suite a push is.
      - name: Reproduce the frozen protocol vectors
        run: mvn -B -ntp verify

      # ci.yml gates this on main and on pull requests, but a tag can be cut from a commit that never
      # went through either — and publishing an implementation whose vendored vectors have drifted
      # from the copies they come from is exactly the divergence this repository exists not to produce.
      - name: Check out the contract, at the version this repository answers for
        uses: actions/checkout@v5
        with:
          repository: rain6fish/keelbase-contract
          ref: v1.1.0
          path: contract-repo

      - name: Check out the main repo's scenario packs
        uses: actions/checkout@v5
        with:
          repository: rain6fish/KeelBase
          ref: main
          path: main-repo

      - name: Vendored snapshot must match its sources
        run: scripts/sync-vectors.sh --check --contract contract-repo --main main-repo

      # The publish reactor excludes `keelbase4j-runtime`, and the adapter nonetheless has a *test*
      # dependency on it — so a build that compiles tests would look for
      # `cn.com.keelbase:keelbase4j-runtime:jar:<version>` in Maven Central, where it does not exist
      # and never will. Not a theory: that is exactly how the first run of the rehearsal job failed,
      # and it is why this step exists. Installing it into the runner's throwaway repository is what
      # lets the publish set stay at four modules while the adapter still compiles its tests.
      - name: Install the module the publish set builds against but does not publish
        run: mvn -B -ntp -DskipTests install -pl keelbase4j-runtime -am

      # A tag release cannot be taken back, so what it publishes is checked rather than assumed. The
      # set is the *reactor*, not a per-module deploy flag: the first attempt at this shipped every
      # module (and failed on one of them) because the publishing plugin bundles the whole reactor,
      # and `maven.deploy.skip` never applied to it — no module declares it, which is why the deploy
      # step's `-pl` is the only thing standing between this job and the whole reactor. So the deploy
      # below restricts the reactor, and this step checks that restriction is still in effect —
      # exactly four modules: the parent pom, the protocol library, the core and the adapter. The
      # parent travels with them because a child pom whose parent is absent cannot be resolved.
      - name: Publishing only the parent pom, the protocol library, the core and the adapter
        run: |
          set -euo pipefail
          reactor=$(mvn -B -Prelease -DskipTests \
                    -pl 'keelbase4j-springai,!keelbase4j-runtime' -am validate \
                    | grep -cE "^\[INFO\] Building ")
          echo "modules in the publish reactor: $reactor"
          [ "$reactor" = "4" ] || {
            echo "expected the parent pom, keelbase4j-protocol, keelbase4j-core and keelbase4j-springai — check the deploy step's -pl/-am" >&2
            exit 1
          }

      - name: Import the signing key
        run: echo "${{ secrets.GPG_SECRET_KEY }}" | gpg --batch --yes --import

      # Central refuses a deployment whose signatures it cannot check: "Could not find a public key by
      # the key fingerprint" is what the first two attempts failed with, because the key that signs is
      # born in CI and its public half had never been published. Sending is not enough on its own —
      # the keyserver has to *index* it, and Central's lookup happened seconds later. The third
      # attempt, minutes after the send, went through. So: if this error comes back, re-run the job
      # rather than changing the key. Harmless to repeat.
      - name: Publish the signing key to the keyservers Central reads
        run: |
          gpg --keyserver keyserver.ubuntu.com --send-keys "${{ secrets.GPG_KEY_ID }}"
          gpg --keyserver pgp.mit.edu --send-keys "${{ secrets.GPG_KEY_ID }}" || true

      - name: Write Maven settings (Central Portal token)
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_TOKEN_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_TOKEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # -pl ... -am: the reactor *is* the publish set (see the check above). -DskipTests: the suite
      # already ran three steps up, on this same commit — the gate is the step, not the phase.
      - name: Deploy to Maven Central Portal
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -Prelease deploy -DskipTests \
            -pl 'keelbase4j-springai,!keelbase4j-runtime' -am \
            -Dgpg.keyname="${{ secrets.GPG_KEY_ID }}" -Dgpg.passphrase="$GPG_PASSPHRASE"
