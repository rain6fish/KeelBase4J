# KeelBase4J CI — protocol conformance.
#
# The point of this repository is that a Java implementation reproduces the language-neutral
# vectors of the KeelBase AI Governance Protocol. CI proves exactly that, on every push:
#   1. conformance — the implementation still reproduces the vendored vectors, on the baseline JDK and
#      on the newest JDK this repository claims to run on;
#   2. vector-drift — the vendored vectors still match the copies they are refreshed from: the
#      contract repository, at the version this repository answers for, plus the main repo's scenario
#      packs, which are not part of the contract. They must never be hand-edited here; a divergence
#      means one side moved without the other.
#   3. bilingual-comments — every javadoc block reads English and then Chinese, each as a block. Not a
#      conformance claim, but the same kind of gate: that rule was enforced by whoever happened to be
#      reviewing, the interleaved shape went in twice in one session with nobody catching it, and a
#      rule that depends on who is looking is not enforced.
#   4. release-rehearsal — the publish set still builds under the release profile, sources and javadoc
#      included, on the baseline JDK and on 25 (javadoc is the part most likely to disagree with a newer
#      one). Also not a conformance claim, and for the same reason as 3: the release job's own
#      check runs after the tag exists, which is the moment nothing can be undone.
#   5. version-coordinate — no local coordinate of this runtime claims a release it was not built from.
#      The same shape as 3 and 4: the version only advances inside a release commit, so a tree left on a
#      released number keeps building under that number, and a local install then answers for a release
#      it was not built from — silently, on whatever machine did the install. The gate reads the local
#      Maven repository against this repository's own tags and fails when a released coordinate holds a
#      jar written after that release. An install runs first, and it is not incidental: a fresh runner
#      has nothing to read, so without it the gate would pass by having nothing to look at.
#   6. contract-pin — the two workflows answer for the same contract version, and every push says so.
#      `--bump` moves both `ref:` values in one step, but half a bump did happen: ci.yml moved to
#      v1.14.0 and release.yml stayed on v1.12.0 for 21 hours, with nothing looking. The gate reads only
#      this repository — no sibling checkout, no network — so that state is red on the push that creates
#      it and cannot be red for any other reason. The lag behind the newest contract release is reported
#      by the same job as a warning, never as a red: CT-4 makes one window behind the normal state
#      between the moments a pin is allowed to move.
#
# ── 中文 ──
#
# KeelBase4J CI —— 协议一致性。
#
# 本仓的全部意义，在于一个 Java 实现能复现 KeelBase AI 治理协议的、与语言无关的向量。CI 每次推送
# 证明的正是这件事：
#   1. conformance —— 实现仍能复现随仓携带的向量，在基线 JDK 与它声称要跑的最新 JDK 上都跑；
#   2. vector-drift —— 随仓携带的向量仍与它们被刷新自的那份副本一致：契约仓，在**本仓所回答的那个版本**
#      上，加上主仓的场景包（它们不属于契约）。这些文件绝不在这里手改；一旦分叉，说明一边动了另一边没动。
#   3. bilingual-comments —— 每个 javadoc 块都是先英文后中文、各自成块。这不是一致性声明，而是同类的闸：
#      那条规则此前靠碰巧在审的人执行，交错写法的注释在一个会话里进了两次而没人发现，而「取决于谁在看」
#      的规则不算被执行的规则。
#   4. release-rehearsal —— 发布集合仍能在 release profile 下构建，含 sources 与 javadoc，在基线 JDK 与
#      25 上（javadoc 是最可能与新版不一致的一环）。这也算不上一致性声明，理由与 3 同：发布 job 自己的检查
#      在 tag 已经存在之后才跑，而那一刻什么都收不回来。
#   5. version-coordinate —— 本运行时没有任何本地坐标冒领一个它不是从那个版本构建出来的发布。形状同 3、4：
#      版本号只在一次发版提交里前进，所以停在一个已发布号上的树会一直以那个号构建，随后本机安装就会
#      为一个它不是从那构建出来的发布作答——悄悄地在装了它的那台机器上。这道闸拿本机 Maven 仓库对本仓
#      自己的 tag，当一个已发布坐标下放着晚于那次发布的 jar 时失败。检查前先装一次，这不是附带的：干净的
#      runner 无物可读，没有这次安装，闸会「什么都没找到」地通过。
#   6. contract-pin —— 两个工作流回答的是同一个契约版本，而且每次推送都这么说。`--bump` 一步同时移动两处
#      `ref:`，但「只改了一半」确实发生过：ci.yml 移到 v1.14.0，而 release.yml 在 v1.12.0 上停了 21 小时，
#      期间没有任何东西在看。这道闸只读本仓库——不检出兄弟仓、不联网——所以那种状态在造成它的那次推送
#      上就是红的，也不会为别的任何原因变红。落后最新契约发布多少，由同一个 job 以警告报告，永不变红：
#      CT-4 把「落后一个窗口」定成 pin 允许移动的那些时刻之间的常态。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Protocol conformance (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # Two legs, and the second one is the point. The artifacts are built for 17 (`--release 17`, the
    # baseline this repository promises the applications it generates), but nothing here had ever *run*
    # on a newer JDK — so "it works on 25" was a claim nobody was checking, and a claim nobody checks is
    # a claim that rots. The leg asserts what it says and no more: the build and the tests run on 25. It
    # does not move the baseline, and it does not build the artifacts for 25.
    #
    # fail-fast is off so that a red 17 leg still reports what 25 did: the two legs answer different
    # questions, and cancelling one hides the answer to the other.
    #
    # 两条腿，第二条才是重点。产物按 17 构建（`--release 17`，本仓对它生成的应用所承诺的基线），但此前
    # 从没有任何东西**在更新的 JDK 上跑过** —— 于是「25 上能用」是一句没人核的话，而没人核的话会烂掉。这条腿
    # 只断言它说的：构建与测试在 25 上跑通。它不抬基线，也不为 25 构建产物。
    #
    # fail-fast 关掉，是为了 17 红了之后 25 的结果照常报出来：两条腿回答的是不同的问题，取消其一等于把另一个
    # 的答案藏起来。
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Reproduce the frozen protocol vectors
        run: mvn -B -ntp verify

  vector-drift:
    name: Vendored snapshot matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The snapshot has two sources, and the gate checks both by checking out both: the same script
      # that refreshes it also gates it, so it catches files that are missing here or stale, not just
      # ones whose content changed.
      - name: Check out the contract, at the version this repository answers for
        uses: actions/checkout@v5
        with:
          repository: rain6fish/keelbase-contract
          # Pinned to a version, deliberately not `main`: a consumer that tracks `main` is not pinned
          # to anything, and this repository's compatibility claim is a version, not a moving target.
          #
          # Raised from v1.1.0 on 2026-10-11, and that raise is itself the finding: the pin had been
          # left two schema generations behind, so this gate compared the snapshot against a contract
          # this repository no longer answers for — and stayed green while the snapshot drifted from
          # the one it does. A pin that is never raised is a gate that stops looking.
          #
          # 2026-10-11 从 v1.1.0 抬起，而**这次抬起本身就是那个发现**：那个 pin 被落下两代 schema，
          # 于是这道闸一直拿**本仓早已不再回答的那个**契约去比快照 —— 快照对着**当下**那份漂移，而它
          # 一直是绿的。**一个从不抬起的 pin，是一道不再看的闸。**
          #
          # Raised again to v1.8.0 on 2026-10-12: it carries `wire-schema-registry-v2.json`, which this
          # repository now reads (ADR-0007 §3 `Q10`). A version in the pin is also what makes that file
          # vendorable — the snapshot is taken from a version, never from `main`.
          #
          # 2026-10-12 再抬到 v1.8.0：它带着 `wire-schema-registry-v2.json`，而本仓现在读的就是它
          # （ADR-0007 §3 的 `Q10`）。pin 用的是**版本**，这本身也就是那份文件**能被 vendor 进来**的原因
          # —— 快照取自一个版本，从不取自 `main`。
          #
          # Raised to v1.14.0 on 2026-10-20 for the v6 schema generation: it declares the optional
          # `executionId` on the audit row and on the side-effect `item`/`traceItem`, which this
          # runtime now sends so a side effect can be paired with the audit row of the same governed
          # execution. The snapshot was refreshed from that version and matches it exactly.
          #
          # 2026-10-20 抬到 v1.14.0，对应 v6 这一代 schema：它在审计行与副作用的 `item`/`traceItem`
          # 上声明了**可选**的 `executionId`，本运行时现在会发出它，好让一条副作用能与写下它的那一次
          # 受治理执行的审计行**精确配成对**。快照正是从该版本刷新、且与之逐字节一致。
          ref: v1.14.0
          path: contract-repo
      # Scenario packs are not part of the contract, so they are still taken from where they live —
      # but at a version, not at `main`. Read at the branch tip, this gate's verdict for one commit
      # depended on when the sibling's `main` happened to be read: a commit synced from `main` goes red
      # the moment `main` moves again, and the same SHA goes green again after the next re-sync. Both
      # workflows gate the same snapshot, so both pin the same version; raising it is a deliberate edit
      # made together with re-syncing the snapshot, the same way the contract pin above is raised.
      #
      # 场景包不属于契约，故仍从它们所在的地方取 —— 但取的是一个版本，不是 `main`。若按分支 tip 读，
      # 这道闸对同一个提交的判决就取决于读那一刻兄弟仓的 `main` 在哪：一次从 `main` 同步出来的提交，
      # 只要 `main` 再动一次就会红；同一个 SHA 在下一次重新同步之后又变绿。两个工作流守的是同一份快照，
      # 故都钉同一个版本；抬它是一次显式改动，要与重新同步快照一起做，同上面那个契约 pin 的抬法。
      - name: Check out the main repo's scenario packs
        uses: actions/checkout@v5
        with:
          repository: rain6fish/KeelBase
          ref: v1.2.0
          path: main-repo
      - name: Vendored snapshot must match its sources
        run: scripts/sync-vectors.sh --check --contract contract-repo --main main-repo

  contract-pin:
    name: Both workflows pin one contract version
    runs-on: ubuntu-latest
    # What this job judges, and what it refuses to judge.
    #
    # `sync-vectors.sh --bump` moves the contract pin in ci.yml and release.yml in one step, but a
    # half-applied bump is not hypothetical: on 2026-10-20 ci.yml moved to v1.14.0 for the v6 schema
    # generation and release.yml stayed on v1.12.0 for 21 hours. In that window a tag cut from the
    # tree would have been verified by the release gate against one contract while every push was
    # verified against another, and nothing was looking at the pair. The first step makes that state
    # red, on every push to main and every pull request.
    #
    # That gate reads only this repository: `--pins-only` compares the two `ref:` values and checks
    # each one is a release tag, with no sibling checkout and no network. That is deliberate — a gate
    # that needs the contract remote can go red because a remote had a bad minute, and a gate that can
    # go red for something other than the thing it judges is a gate that gets switched off. The price
    # is that it cannot see the tag list, so "is this version stale" is not its question.
    #
    # The second step asks that question and answers it as a warning, never as a red. CT-4 lets the
    # pin trail the newest contract release by one window, and the pin moves only when something needs
    # it to move; a gate on lag would be red in the normal state between releases, and a gate that is
    # red in the normal state is a gate people learn to ignore. The reminder shows up as workflow
    # warnings and in the step summary. The threshold is `--lag 2` rather than the script's default of
    # 1 because this runs on every push: one window behind is the state CT-4 calls normal, and a
    # warning that fires in the normal state trains the same reflex a red one would.
    #
    # Nothing here is scheduled. A `schedule:` trigger on this file would cover every job in it, the
    # Maven legs included, and a tree nobody is pushing to has nobody to act on the reminder. The cron
    # in the script's header remains the way to get a weekly look at a quiet tree.
    #
    # 本 job 判什么、以及它拒绝判什么。
    #
    # `sync-vectors.sh --bump` 一步同时移动 ci.yml 与 release.yml 里的契约 pin，但「只改了一半」不是假设：
    # 2026-10-20 ci.yml 为 v6 这一代 schema 移到 v1.14.0，而 release.yml 在 v1.12.0 上停了 21 小时。在那段
    # 时间里，从这棵树打出的 tag 会由发布闸按一个契约校验，而每一次推送由 ci.yml 按另一个契约校验 ——
    # 并且没有任何东西在看这一对。第一步把这种状态判红，每次推送 main 与每个 PR 都跑。
    #
    # 这道闸只读本仓库：`--pins-only` 比较两个 `ref:` 并检查各自是发布 tag，不检出兄弟仓、不联网。这是
    # 有意的 —— 需要契约远端的闸会因为远端抖了一下而红，而会为「不是它要判的东西」变红的闸，最后都会
    # 被人关掉。代价是它看不见 tag 列表，所以「这个版本是不是落后了」不是它的问题。
    #
    # 第二步问那个问题，且只以警告作答、永不变红。CT-4 允许 pin 落后最新契约发布一个窗口，而 pin 只在
    # 需要它动的时候才动；拿落后做闸，在两次发布之间的常态里就是红的，而在常态里变红的闸，是人们学会
    # 去无视的闸。提醒以 workflow 警告与 step summary 呈现。阈值取 `--lag 2`、而非脚本默认的 1，是因为
    # 它每次推送都跑：落后一个窗口正是 CT-4 所说的常态，而在常态里就响的警告，训练出的反射和红的一样。
    #
    # 这里没有任何定时。在这个文件上加 `schedule:` 会覆盖它的每一个 job，含几条 Maven 腿，而一棵没人
    # 推送的树，也没人去处理那条提醒。脚本头部那条 cron 仍是「安静时每周看一眼」的办法。
    steps:
      - uses: actions/checkout@v5
      - name: The two workflows pin the same released version
        run: bash scripts/check-pin-lag.sh --pins-only --strict
      # The report is allowed to fail as a step and never as a run: what it has to say is worth a
      # warning line, not a blocked push, and a remote it cannot reach must not turn a reminder into a
      # red. The script's own exit code is read rather than propagated, so the warning says which.
      #
      # 这份报告允许「以步骤失败」而不允许「以整轮失败」：它要说的话值得一行警告，不值得拦住一次推送，
      # 而一个它够不着的远端不能把提醒变成红。脚本自己的退出码是被读出来、而不是被传播的，好让警告说清是哪种。
      - name: How far the pin trails the newest contract release (a reminder, never a gate)
        continue-on-error: true
        run: |
          set -uo pipefail
          out=$(bash scripts/check-pin-lag.sh --lag 2 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | sed -n 's/^REMINDER: /::warning::/p'
          if [ "$rc" -ne 0 ]; then
            echo "::warning::the lag reminder could not read the contract tags (exit $rc); the pin gate above is unaffected"
          fi
          {
            echo '### Contract pin'
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bilingual-comments:
    name: Comment blocks read English then Chinese
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The self-test runs first because it is what says the classification works on *this* machine:
      # the check depends on byte-wise string comparison, and a runner whose awk behaves differently
      # should fail as itself rather than report a clean zero.
      # Invoked through bash rather than by its path, and not out of caution: this repository is
      # developed on Windows, where `core.filemode` is false, so the executable bit cannot be committed
      # — `git commit -- <paths>` re-stages from the working tree and drops it. A step that depends on
      # the bit would fail with "Permission denied" for a reason that has nothing to do with comments.
      - name: The checker agrees with itself here
        run: bash scripts/check-bilingual-comments.sh --self-test
      - name: Every javadoc block is English and then Chinese
        run: bash scripts/check-bilingual-comments.sh --strict
      # The same class of gate as the one above, and for the same reason: the "KeelBase family" section
      # at the top of each README is generated, and a generated section that nobody compares against its
      # source is a section that drifts. This copy carries a stamp of its own body on its BEGIN line, so
      # the check needs no sibling checkout and no network access — which is what lets it live here.
      #
      # 与上面那道同类，也是同一个道理：每个 README 开头的「KeelBase 家族」段是生成的，而一段没人拿去和
      # 来源比的生成段会漂。这一份在 BEGIN 行自带自身内容的戳，故校验既不需要兄弟检出、也不需要联网 ——
      # 这也正是它能待在这里的原因。
      - name: The generated family section still matches its stamp
        run: node scripts/check-family-block.mjs

  release-rehearsal:
    name: The publish set builds the way a release would build it (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The same two legs as conformance, and here they earn their keep for a different reason: this is the
    # job that runs javadoc, and javadoc's doclint is the thing most likely to disagree with a newer JDK —
    # it is stricter with every release. That this is not hypothetical is what the note below records: the
    # job exists because javadoc had never been asked to run anywhere, and it failed the first time it was.
    # The publish itself stays on 17 (release.yml), so the 25 leg claims only that the release profile —
    # sources and javadoc included — builds there.
    #
    # fail-fast is off for the same reason as in conformance: a red 17 leg must not hide what 25 said.
    #
    # 与 conformance 同样的两条腿；在这里它另有价值：这是个跑 javadoc 的 job，而 javadoc 的 doclint 恰恰是
    # 最可能与更新的 JDK 不合的东西 —— 它每个版本都更严。说它不是假设，就是下面那段注记记的事：这个 job 的
    # 存在本身，就是因为 javadoc 此前从没被要求跑过，而第一次跑就失败了。发布本身仍留在 17（release.yml），
    # 故 25 那条腿只声明：release profile（含 sources 与 javadoc）在那边构建得出来。
    #
    # fail-fast 同样关掉：17 红了不该把 25 说的话藏起来。
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The release itself is checked at tag time, and that is too late to learn anything: a tag
      # cannot be taken back, and the step that would have refused it runs in the job that already has
      # the tag. So the same reactor is built here, on every push, under the release profile — the
      # sources and javadoc jars Central requires included.
      #
      # This job exists because of what it found the first time it was run: the core's javadoc had
      # never been generated anywhere, and could not be — a `<vendor>` in a comment was read as an
      # HTML tag, and javadoc fails on that. Nothing before that point had ever asked it to try.
      #
      # `package`, not `verify`: signing belongs to the release job, which is the only place the key
      # exists. The module list and the reason for it are the publish set's, in release.yml.
      #
      # The install comes first, and the reason is the one the release job writes down: the adapter has
      # a *test* dependency on the runtime, which the publish set excludes, so a build that compiles
      # tests would go looking for it in Maven Central. This job exists to find that kind of thing —
      # it found this one, on its first run.
      - name: Install the module the publish set builds against but does not publish
        run: mvn -B -ntp -DskipTests install -pl keelbase4j-runtime -am
      - name: Build the publish set, sources and javadoc included
        run: mvn -B -ntp -Prelease -DskipTests -pl 'keelbase4j-springai,!keelbase4j-runtime' -am package
      # The same count release.yml asserts, asserted here as well: there it is the last thing between
      # a mistake and Maven Central, here it is the first thing that notices one.
      - name: The publish set is still exactly four modules
        run: |
          set -euo pipefail
          reactor=$(mvn -B -ntp -Prelease -DskipTests \
                    -pl 'keelbase4j-springai,!keelbase4j-runtime' -am validate \
                    | grep -cE "^\[INFO\] Building ")
          echo "modules in the publish reactor: $reactor"
          [ "$reactor" = "4" ] || {
            echo "expected the parent pom, keelbase4j-protocol, keelbase4j-core and keelbase4j-springai" >&2
            exit 1
          }

  version-coordinate:
    name: No local coordinate claims a release it was not built from
    runs-on: ubuntu-latest
    # The check compares the local Maven repository against this repository's release tags, and a fresh
    # runner has neither a populated repository nor, by default, any tags — so the job supplies both.
    # A full checkout brings the tags; installing the reactor puts this tree's own version into ~/.m2,
    # and that install is the whole reason the check can say anything: a clean runner has nothing to
    # read, so on its own the check would pass by finding nothing. With a version a tag already owns,
    # the install writes under that released coordinate and the check finds a jar built here where the
    # published artifact belongs. The release commit itself is not caught — its version has no tag yet,
    # so there is nothing to compare it against; the bump that must follow it is the thing that is.
    #
    # 这道检查拿本机 Maven 仓库去对本仓的发版 tag，而干净的 runner 既没有填过的仓库、默认也没有任何 tag
    # —— 所以本 job 两样都补上：完整检出把 tag 带进来；安装 reactor 把这棵树自己的版本写进 ~/.m2，
    # 而**正是这次安装**让检查说得上话：干净的 runner 无物可读，故单靠它只会「什么都没找到」地通过。
    # 当版本号是某个 tag 已占用的号时，安装就写进那个已发布坐标，检查便在发布物该在的地方发现一份本地构建的 jar。
    # 发版提交本身不会被拦 —— 那个版本的 tag 还不存在、无物可比；该被拦的是它之后必须发生的那次递增。
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags are the reference itself; a shallow clone carries none.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install the reactor under the version this tree declares
        run: mvn -B -ntp -DskipTests install
      - name: No released coordinate holds a jar this tree built
        run: bash scripts/check-m2-drift.sh --strict

