# KeelBase4J CI — protocol conformance.
#
# The point of this repository is that a Java implementation reproduces the language-neutral
# vectors of the KeelBase AI Governance Protocol. CI proves exactly that, on every push:
#   1. conformance — the implementation still reproduces the vendored vectors;
#   2. vector-drift — the vendored vectors still match the copies they are refreshed from: the
#      contract repository, at the version this repository answers for, plus the main repo's scenario
#      packs, which are not part of the contract. They must never be hand-edited here; a divergence
#      means one side moved without the other.
#   3. bilingual-comments — every javadoc block reads English and then Chinese, each as a block. Not a
#      conformance claim, but the same kind of gate: that rule was enforced by whoever happened to be
#      reviewing, the interleaved shape went in twice in one session with nobody catching it, and a
#      rule that depends on who is looking is not enforced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Reproduce the frozen protocol vectors
        run: mvn -B -ntp verify

  vector-drift:
    name: Vendored snapshot matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The snapshot has two sources, and the gate checks both by checking out both: the same script
      # that refreshes it also gates it, so it catches files that are missing here or stale, not just
      # ones whose content changed.
      - name: Check out the contract, at the version this repository answers for
        uses: actions/checkout@v5
        with:
          repository: rain6fish/keelbase-contract
          # Pinned to a version, deliberately not `main`: a consumer that tracks `main` is not pinned
          # to anything, and this repository's compatibility claim is a version, not a moving target.
          ref: v1.1.0
          path: contract-repo
      # Scenario packs are not part of the contract, so they are still taken from where they live.
      - name: Check out the main repo's scenario packs
        uses: actions/checkout@v5
        with:
          repository: rain6fish/KeelBase
          ref: main
          path: main-repo
      - name: Vendored snapshot must match its sources
        run: scripts/sync-vectors.sh --check --contract contract-repo --main main-repo

  bilingual-comments:
    name: Comment blocks read English then Chinese
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The self-test runs first because it is what says the classification works on *this* machine:
      # the check depends on byte-wise string comparison, and a runner whose awk behaves differently
      # should fail as itself rather than report a clean zero.
      # Invoked through bash rather than by its path, and not out of caution: this repository is
      # developed on Windows, where `core.filemode` is false, so the executable bit cannot be committed
      # — `git commit -- <paths>` re-stages from the working tree and drops it. A step that depends on
      # the bit would fail with "Permission denied" for a reason that has nothing to do with comments.
      - name: The checker agrees with itself here
        run: bash scripts/check-bilingual-comments.sh --self-test
      - name: Every javadoc block is English and then Chinese
        run: bash scripts/check-bilingual-comments.sh --strict
