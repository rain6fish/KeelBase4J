# KeelBase4J CI — protocol conformance.
#
# The point of this repository is that a Java implementation reproduces the language-neutral
# vectors of the KeelBase AI Governance Protocol. CI proves exactly that, on every push:
#   1. conformance — the implementation still reproduces the vendored vectors, on the baseline JDK and
#      on the newest JDK this repository claims to run on;
#   2. vector-drift — the vendored vectors still match the copies they are refreshed from: the
#      contract repository, at the version this repository answers for, plus the main repo's scenario
#      packs, which are not part of the contract. They must never be hand-edited here; a divergence
#      means one side moved without the other.
#   3. bilingual-comments — every javadoc block reads English and then Chinese, each as a block. Not a
#      conformance claim, but the same kind of gate: that rule was enforced by whoever happened to be
#      reviewing, the interleaved shape went in twice in one session with nobody catching it, and a
#      rule that depends on who is looking is not enforced.
#   4. release-rehearsal — the publish set still builds under the release profile, sources and javadoc
#      included. Also not a conformance claim, and for the same reason as 3: the release job's own
#      check runs after the tag exists, which is the moment nothing can be undone.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Protocol conformance (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # Two legs, and the second one is the point. The artifacts are built for 17 (`--release 17`, the
    # baseline this repository promises the applications it generates), but nothing here had ever *run*
    # on a newer JDK — so "it works on 25" was a claim nobody was checking, and a claim nobody checks is
    # a claim that rots. The leg asserts what it says and no more: the build and the tests run on 25. It
    # does not move the baseline, and it does not build the artifacts for 25.
    #
    # fail-fast is off so that a red 17 leg still reports what 25 did: the two legs answer different
    # questions, and cancelling one hides the answer to the other.
    #
    # 两条腿，第二条才是重点。产物按 17 构建（`--release 17`，本仓对它生成的应用所承诺的基线），但此前
    # 从没有任何东西**在更新的 JDK 上跑过** —— 于是「25 上能用」是一句没人核的话，而没人核的话会烂掉。这条腿
    # 只断言它说的：构建与测试在 25 上跑通。它不抬基线，也不为 25 构建产物。
    #
    # fail-fast 关掉，是为了 17 红了之后 25 的结果照常报出来：两条腿回答的是不同的问题，取消其一等于把另一个
    # 的答案藏起来。
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Reproduce the frozen protocol vectors
        run: mvn -B -ntp verify

  vector-drift:
    name: Vendored snapshot matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The snapshot has two sources, and the gate checks both by checking out both: the same script
      # that refreshes it also gates it, so it catches files that are missing here or stale, not just
      # ones whose content changed.
      - name: Check out the contract, at the version this repository answers for
        uses: actions/checkout@v5
        with:
          repository: rain6fish/keelbase-contract
          # Pinned to a version, deliberately not `main`: a consumer that tracks `main` is not pinned
          # to anything, and this repository's compatibility claim is a version, not a moving target.
          ref: v1.1.0
          path: contract-repo
      # Scenario packs are not part of the contract, so they are still taken from where they live.
      - name: Check out the main repo's scenario packs
        uses: actions/checkout@v5
        with:
          repository: rain6fish/KeelBase
          ref: main
          path: main-repo
      - name: Vendored snapshot must match its sources
        run: scripts/sync-vectors.sh --check --contract contract-repo --main main-repo

  bilingual-comments:
    name: Comment blocks read English then Chinese
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The self-test runs first because it is what says the classification works on *this* machine:
      # the check depends on byte-wise string comparison, and a runner whose awk behaves differently
      # should fail as itself rather than report a clean zero.
      # Invoked through bash rather than by its path, and not out of caution: this repository is
      # developed on Windows, where `core.filemode` is false, so the executable bit cannot be committed
      # — `git commit -- <paths>` re-stages from the working tree and drops it. A step that depends on
      # the bit would fail with "Permission denied" for a reason that has nothing to do with comments.
      - name: The checker agrees with itself here
        run: bash scripts/check-bilingual-comments.sh --self-test
      - name: Every javadoc block is English and then Chinese
        run: bash scripts/check-bilingual-comments.sh --strict

  release-rehearsal:
    name: The publish set builds the way a release would build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The release itself is checked at tag time, and that is too late to learn anything: a tag
      # cannot be taken back, and the step that would have refused it runs in the job that already has
      # the tag. So the same reactor is built here, on every push, under the release profile — the
      # sources and javadoc jars Central requires included.
      #
      # This job exists because of what it found the first time it was run: the core's javadoc had
      # never been generated anywhere, and could not be — a `<vendor>` in a comment was read as an
      # HTML tag, and javadoc fails on that. Nothing before that point had ever asked it to try.
      #
      # `package`, not `verify`: signing belongs to the release job, which is the only place the key
      # exists. The module list and the reason for it are the publish set's, in release.yml.
      #
      # The install comes first, and the reason is the one the release job writes down: the adapter has
      # a *test* dependency on the runtime, which the publish set excludes, so a build that compiles
      # tests would go looking for it in Maven Central. This job exists to find that kind of thing —
      # it found this one, on its first run.
      - name: Install the module the publish set builds against but does not publish
        run: mvn -B -ntp -DskipTests install -pl keelbase4j-runtime -am
      - name: Build the publish set, sources and javadoc included
        run: mvn -B -ntp -Prelease -DskipTests -pl 'keelbase4j-springai,!keelbase4j-runtime' -am package
      # The same count release.yml asserts, asserted here as well: there it is the last thing between
      # a mistake and Maven Central, here it is the first thing that notices one.
      - name: The publish set is still exactly four modules
        run: |
          set -euo pipefail
          reactor=$(mvn -B -ntp -Prelease -DskipTests \
                    -pl 'keelbase4j-springai,!keelbase4j-runtime' -am validate \
                    | grep -cE "^\[INFO\] Building ")
          echo "modules in the publish reactor: $reactor"
          [ "$reactor" = "4" ] || {
            echo "expected the parent pom, keelbase4j-protocol, keelbase4j-core and keelbase4j-springai" >&2
            exit 1
          }

