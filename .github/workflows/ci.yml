# KeelBase4J CI — protocol conformance.
#
# The point of this repository is that a Java implementation reproduces the language-neutral
# vectors of the KeelBase AI Governance Protocol. CI proves exactly that, on every push:
#   1. conformance — the implementation still reproduces the vendored vectors;
#   2. vector-drift — the vendored vectors still match the authoritative copy in the main repo
#      (they must never be hand-edited here; a divergence means one side moved without the other).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Reproduce the frozen protocol vectors
        run: mvn -B -ntp verify

  vector-drift:
    name: Vendored vectors match the main repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The authoritative vectors live in the main repo. It is checked out (rather than fetched
      # file-by-file against a hard-coded list) so the same script that refreshes the snapshot
      # also gates it: one implementation, and it catches vectors that are missing here or stale,
      # not just ones whose content changed.
      - name: Check out the main repo's vectors
        uses: actions/checkout@v5
        with:
          repository: rain6fish/KeelBase
          ref: main
          path: main-repo
      - name: Vendored vectors must match the main repo
        run: scripts/sync-vectors.sh main-repo --check
