#
# JV-24 — the flagship demo's container. One service: the **generated** application.
#
# Its build context is the generated project, which only exists after `scripts/demo-flagship-generated.sh`
# has generated it — this file is that script's, not a way to run the demo by hand from a clean checkout.
#
# The database is a **bind mount**, not a named volume, on purpose: the harness seeds the same directory
# from the host (the H2 file admits one process at a time, so the seed runs while the app is stopped), and
# a bind mount lets both sides be the same files. What the mount buys is stated in the Dockerfile — the
# data stays out of the container's writable layer — and the harness asserts it by restarting the
# container and looking for the same rows.
#
# JV-24 —— 旗舰演示的容器。只有一个服务：那个**生成的**应用。
#
# 它的构建上下文就是生成出来的工程，而那个工程只有 `scripts/demo-flagship-generated.sh` 生成之后才存在
# ——本文件是那个脚本的，不是「在一个干净检出上手动跑演示」的办法。
#
# 库用**绑定挂载**而不是具名卷，是有意的：harness 从宿主机往同一个目录灌种子（H2 文件一次只许一个进程，
# 故种子在应用停着时跑），绑定挂载让两边**是同一批文件**。这个挂载换来的东西写在 Dockerfile 里——数据
# 不在容器的可写层——而 harness 用**重启容器再找同样的行**来断言它。
services:
  app:
    build:
      context: ./target/gen-flagship
      dockerfile: Dockerfile
    ports:
      - "${FLAGSHIP_PORT:-18086}:8080"
    environment:
      # The passphrase that turns on the generated application's login (JV-43). Left with an empty
      # default on purpose: the application ships no passphrase of its own, so with this unset it
      # refuses every login rather than opening one nobody configured. `demo-flagship-generated.sh`
      # generates a value per run and exports it — a hand-run `compose up` simply has no login.
      #
      # 打开生成物登录面（JV-43）的口令。刻意留空默认值：应用自己不带口令，故未设时它**拒绝每一次登录**，
      # 而不是开一个没人配过的登录。`demo-flagship-generated.sh` 每次运行现生成并导出——手动
      # `compose up` 则干脆没有登录。
      KEELBASE_DEMO_PASSWORD: "${KEELBASE_DEMO_PASSWORD:-}"
    volumes:
      - ./target/gen-flagship/data:/app/data

  # The clickable half. It exists so the front end and the API share an origin — see scripts/flagship/nginx.conf
  # — and it serves the front end's own build, mounted read-only from the generated project's `web/`.
  #
  # 可点的那一半。它存在的理由是让前端与接口**同源**（见 `scripts/flagship/nginx.conf`），而它伺服的是
  # 前端自己的构建产物，从生成物工程的 `web/` 只读挂进来。
  web:
    image: nginx:alpine
    ports:
      - "${FLAGSHIP_WEB_PORT:-18087}:80"
    volumes:
      - ./target/gen-flagship/web:/usr/share/nginx/html:ro
      - ./scripts/flagship/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
