# Test profile. Same in-memory database as the main configuration, with one deliberate difference:
# a generous lock timeout, so a test that holds the audit chain's lock and releases it can rely on the
# waiter blocking rather than on how quickly H2 gives up. Without this the wait would race the default
# timeout and the concurrency test would be flaky rather than wrong.
spring.datasource.url=jdbc:h2:mem:keelbase;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
