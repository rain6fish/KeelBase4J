# KeelBase4J runtime (spike) — minimal configuration.
spring.application.name=keelbase4j

# The whole surface is mounted under the reference's path prefix. The runtime-neutral frontend keeps
# one base URL (/api/v1, the reference's global prefix) and no per-runtime branch, so a second runtime
# that answers at the root is not a second runtime it can talk to — it is a 404 for every call. Before
# this, only the two F5 endpoints carried the prefix and everything else sat at the root, which meant
# the golden path 404'd even once F4/F5 were in place.
server.servlet.context-path=/api/v1

# In-memory H2. Note what that means for the audit chain: appends are serialized on a database row
# lock (see AuditChainHead), which is the very lock a second instance would contend for — but an
# in-memory database is still per-process, so genuinely running two instances needs a shared
# database, which this configuration is not.
spring.datasource.url=jdbc:h2:mem:keelbase;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Flyway owns the schema; Hibernate only checks the entities against what Flyway built. This used to be
# create-drop, which was honest while the runtime was only ever an application with its own throwaway
# database — the schema was whatever the entities said it was. It stopped being honest the moment the
# runtime had to run somewhere else: there, Hibernate validates against a schema somebody else's
# migrations built, and a create-drop deployment never exercises that path. So the standalone deployment
# runs the same shape as an embedded one, and the migrations are on the critical path of every start and
# every test rather than only of the host's. "update" is deliberately not the middle ground: it mutates
# the schema behind Flyway's back and hides exactly the drift this is here to catch.
#
# schema 归 Flyway 所有，Hibernate 只拿实体去比对 Flyway 建出来的东西。这里原本是 create-drop，在运行时
# 还只是一个自带一次性数据库的应用时，那是诚实的——schema 就是实体说什么它就是什么。运行时要跑在别处的那一刻
# 起，它就不诚实了：在别处，Hibernate 校验的是别人迁移建出来的 schema，而 create-drop 的部署永远走不到那条
# 路。所以独立部署现在与嵌入形态跑同一个形状，迁移落在**每次启动与每条测试**的必经路径上，而不是只走宿主那
# 一条。"update" 有意不做折中：它绕开 Flyway 去改 schema，正好掩盖 validate 要抓的那种漂移。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Authentication at the request entry (ADR-0004 D3: Spring Security answers "who is this request";
# KeelBase answers "may this AI behaviour happen"). A caller presents a delegation token — the
# frozen protocol contract — as `Authorization: Bearer <jwt>`. Its subject is then mapped to a local
# user and role by the runtime's identity directory; the token itself grants nothing, which is what
# "delegation never escalates privilege" means (protocol §3).
# Spike defaults below; a deployment supplies DELEGATION_SECRET.
keelbase.delegation.secret=${DELEGATION_SECRET:cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd}
# A token is minted for a target system (protocol §3 aud); one addressed elsewhere is refused.
keelbase.delegation.audience=keelbase4j

# Audit hash-chain key (independent of any data-encryption key). Spike default; a real
# deployment supplies AUDIT_HMAC_KEY as a 64-hex environment variable.
keelbase.audit.hmac-key=${AUDIT_HMAC_KEY:abababababababababababababababababababababababababababababababab}

# What this deployment is, served at GET /app/capabilities and GET /app/provenance (the F5 frontend
# contract surface, conformance-profile §2.2). Declared rather than inferred — a runtime cannot know
# which business modules a deployment exposes.
#
# Only the preset is set here, because these defaults are ASCII-only. The demo profile itself (the
# CRM module, its Chinese label and description) lives in ApplicationProfileProperties, and that is
# deliberate: .properties is read as ISO-8859-1, so a literal non-ASCII value here arrives as
# mojibake even when the file's bytes are correct UTF-8. Overriding a non-ASCII value from this file
# would require \uXXXX escapes; the class avoids the trap by carrying the text itself.
keelbase.app.preset=full
